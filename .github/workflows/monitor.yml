# Runs the Build Tracker's site checks every 10 minutes. The tracker skips a run that comes
# less than 8 minutes after the last one, so this needs no secret.
name: Site monitor
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # A failed call logs a warning instead of failing the run, so a tracker deploy that is
      # pending (or a short outage) doesn't email a failure every 10 minutes. The tracker's own
      # Monitoring page shows when checks last ran.
      - name: Ask the tracker to check every site
        run: curl -fsS --max-time 90 https://sitetracker.tourground.com/api/cron/monitor || echo "::warning::The tracker did not answer the monitor call"
